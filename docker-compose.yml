services:
  postgres:
    image: postgres:16
    container_name: paymentcore-db
    environment:
      POSTGRES_USER: paymentcore
      POSTGRES_PASSWORD: paymentcore_dev
      POSTGRES_DB: paymentcore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: